<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
        <link rel="icon" href="/smol/favicon.ico" type="image/x-icon">
        <title>smol - Mol* with Console</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html, body {
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            hr {
                margin: 10px;
            }
            h1, h2, h3, h4, h5 {
                margin-top: 5px;
                margin-bottom: 3px;
            }
            button {
                padding: 2px;
            }
            #app {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
            }
            #console {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 400px;
                height: calc(8 * 1.5em + 40px);
                background-color: rgba(0, 0, 0, 0.7);
                color: #00ff00;
                font-family: 'Courier New', monospace;
                font-size: 12px;
                line-height: 1.5em;
                display: none;
                flex-direction: column;
                z-index: 10000;
            }
            #console.visible {
                display: flex;
            }
            #console.overlay {
                width: 100%;
                height: 100%;
                top: 0;
                left: 0;
                background-color: rgba(0, 0, 0, 0.3);
                font-size: 14px;
            }
            #console-output {
                flex: 1;
                overflow-y: auto;
                padding: 10px;
                white-space: pre-wrap;
                word-wrap: break-word;
            }
            #console-output::-webkit-scrollbar {
                width: 12px;
            }
            #console-output::-webkit-scrollbar-track {
                background: #1a1a1a;
            }
            #console-output::-webkit-scrollbar-thumb {
                background: #2a2a2a;
            }
            #console-output::-webkit-scrollbar-thumb:hover {
                background: #333333;
            }
            #console-input-line {
                display: flex;
                padding: 5px 10px;
                border-top: 1px solid rgba(0, 255, 0, 0.3);
            }
            #console-prompt {
                margin-right: 5px;
            }
            #console-input {
                flex: 1;
                background: transparent;
                border: none;
                color: #00ff00;
                font-family: 'Courier New', monospace;
                font-size: 12px;
                outline: none;
            }
        </style>
        <link rel="stylesheet" type="text/css" href="/smol/molstar.css" />
    </head>
    <body>
        <div id="app"></div>
        <div id="console">
            <div id="console-output"></div>
            <div id="console-input-line">
                <span id="console-prompt">smol></span>
                <input type="text" id="console-input" autocomplete="off" />
            </div>
        </div>
        <script type="text/javascript" src="/smol/molstar.js"></script>
        <script type="text/javascript">
            function getParam(name, regex) {
                var r = new RegExp(name + '=' + '(' + regex + ')[&]?', 'i');
                return decodeURIComponent(((window.location.search || '').match(r) || [])[1] || '');
            }

            var debugMode = getParam('debug-mode', '[^&]+').trim() === '1';
            if (debugMode) molstar.setDebugMode(debugMode);

            var timingMode = getParam('timing-mode', '[^&]+').trim() === '1';
            if (timingMode) molstar.setTimingMode(timingMode);

            var hideControls = getParam('hide-controls', '[^&]+').trim() === '1';
            var collapseLeftPanel = getParam('collapse-left-panel', '[^&]+').trim() === '1';
            var pdbProvider = getParam('pdb-provider', '[^&]+').trim().toLowerCase();
            var emdbProvider = getParam('emdb-provider', '[^&]+').trim().toLowerCase();
            var mapProvider = getParam('map-provider', '[^&]+').trim().toLowerCase();
            var pixelScale = getParam('pixel-scale', '[^&]+').trim();
            var pickScale = getParam('pick-scale', '[^&]+').trim();
            var pickPadding = getParam('pick-padding', '[^&]+').trim();
            var transparency = getParam('transparency', '[^&]+').trim().toLowerCase();
            var preferWebgl1 = getParam('prefer-webgl1', '[^&]+').trim() === '1' || void 0;
            var allowMajorPerformanceCaveat = getParam('allow-major-performance-caveat', '[^&]+').trim() === '1';
            var powerPreference = getParam('power-preference', '[^&]+').trim().toLowerCase();
            var illumination = getParam('illumination', '[^&]+').trim() === '1';
            var resolutionMode = getParam('resolution-mode', '[^&]+').trim().toLowerCase();

            molstar.Viewer.create('app', {
                disabledExtensions: [],
                layoutShowControls: false,
                viewportShowExpand: false,
                collapseLeftPanel: collapseLeftPanel,
                pdbProvider: pdbProvider || 'pdbe',
                emdbProvider: emdbProvider || 'pdbe',
                volumeStreamingServer: (mapProvider || 'pdbe') === 'rcsb'
                    ? 'https://maps.rcsb.org'
                    : 'https://www.ebi.ac.uk/pdbe/densities',
                pixelScale: parseFloat(pixelScale) || 1,
                pickScale: parseFloat(pickScale) || 0.25,
                pickPadding: isNaN(parseFloat(pickPadding)) ? 1 : parseFloat(pickPadding),
                transparency: transparency || undefined,
                preferWebgl1: preferWebgl1,
                allowMajorPerformanceCaveat: allowMajorPerformanceCaveat,
                powerPreference: powerPreference || 'high-performance',
                illumination: illumination,
                resolutionMode: resolutionMode || 'auto'
            }).then(viewer => {
                window.viewer = viewer;
                viewer.plugin.canvas3d?.setProps({ renderer: { backgroundColor: 0x000000 } });

                var snapshotId = getParam('snapshot-id', '[^&]+').trim();
                if (snapshotId) viewer.setRemoteSnapshot(snapshotId);

                var snapshotUrl = getParam('snapshot-url', '[^&]+').trim();
                var snapshotUrlType = getParam('snapshot-url-type', '[^&]+').toLowerCase().trim() || 'molj';
                if (snapshotUrl && snapshotUrlType) viewer.loadSnapshotFromUrl(snapshotUrl, snapshotUrlType);

                var structureUrl = getParam('structure-url', '[^&]+').trim();
                var structureUrlFormat = getParam('structure-url-format', '[a-z]+').toLowerCase().trim();
                var structureUrlIsBinary = getParam('structure-url-is-binary', '[^&]+').trim() === '1';
                if (structureUrl) viewer.loadStructureFromUrl(structureUrl, structureUrlFormat, structureUrlIsBinary);

                var mvsUrl = getParam('mvs-url', '[^&]+').trim();
                var mvsData = getParam('mvs-data', '[^&]+').trim();
                var mvsFormat = getParam('mvs-format', '[^&]+').trim() || 'mvsj';
                if (mvsUrl && mvsData) console.error('Cannot specify mvs-url and mvs-data URL parameters at the same time. Ignoring both.');
                else if (mvsUrl) viewer.loadMvsFromUrl(mvsUrl, mvsFormat);
                else if (mvsData) viewer.loadMvsData(mvsData, mvsFormat);

                var pdb = getParam('pdb', '[^&]+').trim();
                if (pdb) viewer.loadPdb(pdb);

                var pdbIhm = getParam('pdb-ihm', '[^&]+').trim();
                if (pdbIhm) viewer.loadPdbIhm(pdbIhm);
                var pdbDev = getParam('pdb-dev', '[^&]+').trim();
                if (pdbDev) viewer.loadPdbIhm(pdbDev);

                var emdb = getParam('emdb', '[^&]+').trim();
                if (emdb) viewer.loadEmdb(emdb);

                var afdb = getParam('afdb', '[^&]+').trim();
                if (afdb) viewer.loadAlphaFoldDb(afdb);

                var modelArchive = getParam('model-archive', '[^&]+').trim();
                if (modelArchive) viewer.loadModelArchive(modelArchive);

                window.addEventListener('unload', () => {
                    viewer.dispose();
                });

                const event = new CustomEvent("molstarViewerCreated", { detail: { viewer } });
                window.dispatchEvent(event);

                // Listen for file to load from command line (via Electron IPC)
                if (window.ipcRenderer) {
                    window.ipcRenderer.on('load-file', function(event, filePath) {
                        var ext = filePath.split('.').pop().toLowerCase();
                        var format = ext;
                        // Map common extensions to Mol* format names
                        if (ext === 'pdb') format = 'pdb';
                        else if (ext === 'sdf' || ext === 'mol') format = 'sdf';
                        else if (ext === 'mol2') format = 'mol2';
                        else if (ext === 'cif' || ext === 'mmcif') format = 'mmcif';
                        else if (ext === 'xyz') format = 'xyz';
                        else if (ext === 'gro') format = 'gro';

                        var fileUrl = 'file://' + filePath;
                        addConsoleOutput('Loading file: ' + filePath);
                        viewer.loadStructureFromUrl(fileUrl, format, false);
                    });

                    // Listen for remote commands (via HTTP server on port 8888)
                    window.ipcRenderer.on('execute-command', function(event, command) {
                        // Only auto-show console if consoleAutoShow is true
                        if (consoleAutoShow) {
                            showConsole();
                        }
                        // Display the command as if typed
                        addConsoleOutput('smol> ' + command);
                        addToHistory(command);
                        // Execute and send result back to main process
                        executeCommand(command, function(result) {
                            window.ipcRenderer.send('command-result', result);
                        });
                    });
                }
            });

            var consoleDiv = document.getElementById('console');
            var consoleOutput = document.getElementById('console-output');
            var consoleInput = document.getElementById('console-input');

            var commandHistory = [];
            var historyIndex = -1;
            var currentInput = '';
            var consoleAutoShow = true;  // When false, remote commands won't auto-show console
            var consoleMode = 'compact';  // 'compact' or 'overlay'

            function setConsoleMode(mode) {
                if (mode === 'overlay') {
                    consoleDiv.classList.add('overlay');
                    consoleMode = 'overlay';
                } else {
                    consoleDiv.classList.remove('overlay');
                    consoleMode = 'compact';
                }
            }

            function loadHistory() {
                try {
                    var saved = localStorage.getItem('molstar-console-history');
                    if (saved) {
                        commandHistory = JSON.parse(saved);
                        historyIndex = commandHistory.length;
                    }
                } catch (e) {
                    console.warn('Failed to load command history:', e);
                }
            }

            function saveHistory() {
                try {
                    var toSave = commandHistory.slice(-100);
                    localStorage.setItem('molstar-console-history', JSON.stringify(toSave));
                } catch (e) {
                    console.warn('Failed to save command history:', e);
                }
            }

            function addToHistory(command) {
                if (!command || command.trim() === '') return;
                if (commandHistory.length > 0 && commandHistory[commandHistory.length - 1] === command) {
                    return;
                }
                commandHistory.push(command);
                saveHistory();
                historyIndex = commandHistory.length;
            }

            function navigateHistory(direction) {
                if (commandHistory.length === 0) return;

                if (historyIndex === commandHistory.length) {
                    currentInput = consoleInput.value;
                }

                if (direction === 'up') {
                    if (historyIndex > 0) {
                        historyIndex--;
                        consoleInput.value = commandHistory[historyIndex];
                    }
                } else if (direction === 'down') {
                    if (historyIndex < commandHistory.length - 1) {
                        historyIndex++;
                        consoleInput.value = commandHistory[historyIndex];
                    } else {
                        historyIndex = commandHistory.length;
                        consoleInput.value = currentInput;
                    }
                }

                consoleInput.setSelectionRange(consoleInput.value.length, consoleInput.value.length);
            }

            function addConsoleOutput(text) {
                consoleOutput.textContent += text + '\n';
                consoleOutput.scrollTop = consoleOutput.scrollHeight;
            }

            function showConsole() {
                consoleDiv.classList.add('visible');
                consoleInput.focus();
            }

            function hideConsole() {
                consoleDiv.classList.remove('visible');
            }

            loadHistory();

            consoleOutput.addEventListener('wheel', function(e) {
                consoleOutput.scrollTop += e.deltaY;
                e.preventDefault();
                e.stopPropagation();
            }, { passive: false });

            showConsole();

            document.addEventListener('keydown', function(e) {
                if (e.key === 'F2') {
                    e.preventDefault();
                    if (consoleDiv.classList.contains('visible')) {
                        hideConsole();
                    } else {
                        consoleAutoShow = true;  // User explicitly showing console
                        showConsole();
                    }
                } else if (e.key === 'Enter' && !consoleDiv.classList.contains('visible')) {
                    e.preventDefault();
                    consoleAutoShow = true;  // User explicitly showing console
                    showConsole();
                }
            });

            consoleInput.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    e.preventDefault();
                    hideConsole();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    navigateHistory('up');
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    navigateHistory('down');
                } else if (e.key === 'Enter') {
                    var command = consoleInput.value.trim();
                    if (command) {
                        addConsoleOutput('smol> ' + command);
                        addToHistory(command);
                        executeCommand(command);
                        consoleInput.value = '';
                        historyIndex = commandHistory.length;
                        currentInput = '';
                    }
                }
            });

            function executeCommand(command, onResult) {
                var cb = onResult || function() {};

                // Handle console overlay/compact locally before molstar dispatch
                var cmdParts = command.trim().split(/\s+/);
                if (cmdParts[0].toLowerCase() === 'console' && cmdParts.length > 1) {
                    var sub = cmdParts[1].toLowerCase();
                    if (sub === 'overlay' || sub === 'compact') {
                        setConsoleMode(sub);
                        var msg = 'Console mode: ' + sub;
                        addConsoleOutput(msg);
                        cb(msg);
                        return;
                    }
                }

                if (window.viewer && window.viewer.plugin && window.viewer.plugin.console) {
                    window.viewer.plugin.console.execute(command).then(function(result) {
                        // Handle console actions (hide/show/toggle/overlay/compact)
                        var consoleAction = result.data && result.data.data && result.data.data.consoleAction;
                        if (consoleAction) {
                            if (consoleAction === 'hide') {
                                consoleAutoShow = false;
                                if (result.message) addConsoleOutput(result.message);
                                hideConsole();
                                cb(result.message || 'Console hidden');
                                return;
                            } else if (consoleAction === 'show') {
                                consoleAutoShow = true;
                                showConsole();
                                if (result.message) addConsoleOutput(result.message);
                                cb(result.message || 'Console shown');
                                return;
                            } else if (consoleAction === 'toggle') {
                                if (consoleDiv.classList.contains('visible')) {
                                    consoleAutoShow = false;
                                    hideConsole();
                                } else {
                                    consoleAutoShow = true;
                                    showConsole();
                                }
                                if (result.message) addConsoleOutput(result.message);
                                cb(result.message || 'Console toggled');
                                return;
                            } else if (consoleAction === 'overlay') {
                                setConsoleMode('overlay');
                                if (result.message) addConsoleOutput(result.message);
                                cb(result.message || 'Console overlay');
                                return;
                            } else if (consoleAction === 'compact') {
                                setConsoleMode('compact');
                                if (result.message) addConsoleOutput(result.message);
                                cb(result.message || 'Console compact');
                                return;
                            }
                        }

                        if (result.success) {
                            if (result.message) {
                                addConsoleOutput(result.message);
                            }
                            cb(result.message || 'OK');
                        } else {
                            var errMsg = 'Error: ' + result.message;
                            addConsoleOutput(errMsg);
                            cb(errMsg);
                        }
                    }).catch(function(error) {
                        var errMsg = 'Exception: ' + (error.message || String(error));
                        addConsoleOutput(errMsg);
                        cb(errMsg);
                    });
                    return;
                }

                var parts = command.split(/\s+/);
                var cmd = parts[0].toLowerCase();

                if (cmd === 'help') {
                    executeHelpCommand(parts.slice(1).join(' '));
                    cb('OK');
                } else if (cmd === 'load' && parts.length >= 2) {
                    executeLoadCommand(parts[1]);
                    cb('Loading PDB entry: ' + parts[1]);
                } else if (cmd === 'close') {
                    executeCloseCommand();
                    cb('Clearing all structures');
                } else if (cmd === 'color') {
                    executeColorCommand(command);
                    cb('OK');
                } else {
                    var errMsg = 'Error: Unknown command. Type \'help\' for available commands.';
                    addConsoleOutput(errMsg);
                    cb(errMsg);
                }
            }

            function executeHelpCommand(commandName) {
                var result = molstar.executeHelp(window.viewer ? window.viewer.plugin : null, commandName);
                if (result.success && result.helpText) {
                    addConsoleOutput(result.helpText);
                } else if (result.message) {
                    addConsoleOutput(result.message);
                }
            }

            function executeLoadCommand(pdbId) {
                if (!window.viewer) {
                    addConsoleOutput('Error: Viewer not initialized');
                    return;
                }
                addConsoleOutput('Loading PDB entry: ' + pdbId);
                window.viewer.plugin.clear();
                window.viewer.loadPdb(pdbId);
            }

            function executeCloseCommand() {
                addConsoleOutput('Clearing all structures');
                if (window.viewer) {
                    window.viewer.plugin.clear();
                }
            }

            function executeColorCommand(commandStr) {
                if (!window.viewer) {
                    addConsoleOutput('Error: No structure loaded. Use "load <pdbid>" first.');
                    return;
                }

                try {
                    var colorCmd = molstar.parseColorCommand(commandStr);

                    if (colorCmd.mode === 'unknown') {
                        addConsoleOutput('Error: Invalid color command syntax');
                        return;
                    }

                    if (colorCmd.mode === 'simple') {
                        molstar.executeSimpleColor(window.viewer.plugin, colorCmd).then(function(result) {
                            addConsoleOutput(result.message);
                        }).catch(function(error) {
                            addConsoleOutput('Error: ' + error);
                        });
                    } else {
                        addConsoleOutput('Error: Color mode "' + colorCmd.mode + '" not yet implemented');
                    }
                } catch (error) {
                    addConsoleOutput('Error: ' + error.message);
                }
            }

            addConsoleOutput('welcome to smol.  type \'help\' for help');

            // Apply settings from ~/.smol
            if (window.smolSettings) {
                window.smolSettings.get().then(function(settings) {
                    if (settings.consoleMode) {
                        setConsoleMode(settings.consoleMode);
                    }
                });
            }

            // SpaceMouse 6DOF camera control via IPC from WebSocket bridge
            (function() {
                if (!window.ipcRenderer) return;

                var ROTATE_SCALE = 0.000015625;
                var TRANSLATE_SCALE = 0.00078125;

                window.ipcRenderer.on('spacemouse-event', function(event, data) {
                    try {
                        var ev = JSON.parse(data);

                        var viewer = window.viewer;
                        if (!viewer || !viewer.plugin || !viewer.plugin.canvas3d) return;
                        var canvas3d = viewer.plugin.canvas3d;

                        // Handle clip/fog control events
                        if (ev.type === 'clipfog') {
                            var v = ev.value; // 0-127 MIDI range
                            if (ev.param === 'clipRadius') {
                                // Map 0-127 to radius 1-200
                                canvas3d.setProps({ cameraClipping: { radius: 1 + (v / 127) * 199 } });
                            } else if (ev.param === 'minNear') {
                                // Map 0-127 to minNear 0.1-50
                                canvas3d.setProps({ cameraClipping: { minNear: 0.1 + (v / 127) * 49.9 } });
                            } else if (ev.param === 'fog') {
                                // Map 0-127 to fog 0-100
                                var fogVal = (v / 127) * 100;
                                canvas3d.setProps({ cameraFog: { name: 'on', params: { intensity: fogVal } } });
                            } else if (ev.param === 'exposure') {
                                // Map 0-127 to exposure 0-3
                                canvas3d.setProps({ renderer: { exposure: (v / 127) * 3 } });
                            } else if (ev.param === 'ambient') {
                                // Map 0-127 to ambient intensity 0-2
                                canvas3d.setProps({ renderer: { ambientIntensity: (v / 127) * 2 } });
                            } else if (ev.param === 'lightIntensity') {
                                // Map 0-127 to key light intensity 0-5
                                var props = canvas3d.props;
                                var lights = props.renderer.light;
                                var light0 = Object.assign({}, lights[0], { intensity: (v / 127) * 5 });
                                var newLights = [light0];
                                for (var li = 1; li < lights.length; li++) newLights.push(lights[li]);
                                canvas3d.setProps({ renderer: { light: newLights } });
                            } else if (ev.param === 'fov') {
                                // Map 0-127 to FOV 10-130 degrees
                                canvas3d.setProps({ camera: { fov: 10 + (v / 127) * 120 } });
                            } else if (ev.param === 'sceneRadius') {
                                // Map 0-127 to scene radius factor 1-10
                                canvas3d.setProps({ sceneRadiusFactor: 1 + (v / 127) * 9 });
                            } else if (ev.param === 'lightInclination') {
                                // Map 0-127 to light inclination 0-180 degrees
                                var props = canvas3d.props;
                                var lights = props.renderer.light;
                                var light0 = Object.assign({}, lights[0], { inclination: (v / 127) * 180 });
                                var newLights = [light0];
                                for (var li = 1; li < lights.length; li++) newLights.push(lights[li]);
                                canvas3d.setProps({ renderer: { light: newLights } });
                            } else if (ev.param === 'lightAzimuth') {
                                // Map 0-127 to light azimuth 0-360 degrees
                                var props = canvas3d.props;
                                var lights = props.renderer.light;
                                var light0 = Object.assign({}, lights[0], { azimuth: (v / 127) * 360 });
                                var newLights = [light0];
                                for (var li = 1; li < lights.length; li++) newLights.push(lights[li]);
                                canvas3d.setProps({ renderer: { light: newLights } });
                            // === Page 2 params ===
                            } else if (ev.param === 'interiorDarkening') {
                                // Map 0-127 to interior darkening 0-1
                                canvas3d.setProps({ renderer: { interiorDarkening: v / 127 } });
                            } else if (ev.param === 'celSteps') {
                                // Map 0-127 to cel shading steps 2-16
                                canvas3d.setProps({ renderer: { celSteps: Math.round(2 + (v / 127) * 14) } });
                            } else if (ev.param === 'xrayEdge') {
                                // Map 0-127 to xray edge falloff 0-3
                                canvas3d.setProps({ renderer: { xrayEdgeFalloff: (v / 127) * 3 } });
                            } else if (ev.param === 'rotateSpeed') {
                                // Map 0-127 to rotate speed 1-10
                                canvas3d.setProps({ trackball: { rotateSpeed: Math.round(1 + (v / 127) * 9) } });
                            } else if (ev.param === 'zoomSpeed') {
                                // Map 0-127 to zoom speed 1-15
                                canvas3d.setProps({ trackball: { zoomSpeed: Math.round(1 + (v / 127) * 14) } });
                            } else if (ev.param === 'panSpeed') {
                                // Map 0-127 to pan speed 0.1-5
                                canvas3d.setProps({ trackball: { panSpeed: 0.1 + (v / 127) * 4.9 } });
                            } else if (ev.param === 'edgeScale') {
                                // Map 0-127 to marking edge scale 1-3
                                canvas3d.setProps({ marking: { edgeScale: Math.round(1 + (v / 127) * 2) } });
                            } else if (ev.param === 'ghostEdge') {
                                // Map 0-127 to ghost edge strength 0-1
                                canvas3d.setProps({ marking: { ghostEdgeStrength: v / 127 } });
                            } else if (ev.param === 'highlightStrength') {
                                // Map 0-127 to highlight strength 0-1
                                canvas3d.setProps({ renderer: { highlightStrength: v / 127 } });
                            } else if (ev.param === 'selectStrength') {
                                // Map 0-127 to select strength 0-1
                                canvas3d.setProps({ renderer: { selectStrength: v / 127 } });
                            } else if (ev.param === 'dimStrength') {
                                // Map 0-127 to dim strength 0-1
                                canvas3d.setProps({ renderer: { dimStrength: v / 127 } });
                            } else if (ev.param === 'resetDuration') {
                                // Map 0-127 to camera reset duration 0-1000ms
                                canvas3d.setProps({ cameraResetDurationMs: Math.round((v / 127) * 1000) });
                            } else if (ev.param === 'innerEdge') {
                                // Map 0-127 to inner edge factor 0-3
                                canvas3d.setProps({ marking: { innerEdgeFactor: (v / 127) * 3 } });
                            } else if (ev.param === 'dpoit') {
                                // Map 0-127 to depth peeling iterations 1-10
                                canvas3d.setProps({ dpoitIterations: Math.round(1 + (v / 127) * 9) });
                            } else if (ev.param === 'pickPadding') {
                                // Map 0-127 to pick padding 0-10 pixels
                                canvas3d.setProps({ pickPadding: Math.round((v / 127) * 10) });
                            } else if (ev.param === 'highlightEdgeStrength') {
                                // Map 0-127 to highlight edge strength 0-1
                                canvas3d.setProps({ marking: { highlightEdgeStrength: v / 127 } });
                            // === Page 3 — Global Illumination & Quality ===
                            } else if (ev.param === 'giEnable') {
                                // Boolean: 0-63 = off, 64-127 = on
                                canvas3d.setProps({ illumination: { enabled: v >= 64 } });
                            } else if (ev.param === 'giIterations') {
                                // Map 0-127 to max iterations 0-16 (actual = 2^x)
                                canvas3d.setProps({ illumination: { maxIterations: Math.round((v / 127) * 16) } });
                            } else if (ev.param === 'giBounces') {
                                // Map 0-127 to bounces 1-32

                            } else if (ev.param === 'light2Inclination') {

                                if (lights.length < 2) lights.push({ inclination: 90, azimuth: 180, color: 16777215, intensity: 0.6 });
                                lights[1] = Object.assign({}, lights[1], { intensity: (v / 127) * 5 });
                                canvas3d.setProps({ renderer: { light: lights } });
                            } else if (ev.param === 'pickingAlpha') {

                            } else if (ev.param === 'selectEdgeStrength') {
                                // Map 0-127 to select edge strength 0-1
                                canvas3d.setProps({ marking: { selectEdgeStrength: v / 127 } });
                            } else if (ev.param === 'transparentBg') {
                                // Boolean: 0-63 = off, 64-127 = on
                                canvas3d.setProps({ transparentBackground: v >= 64 });
                            } else if (ev.param === 'interiorColorFlag') {
                                // Boolean: 0-63 = off, 64-127 = on
                                canvas3d.setProps({ renderer: { interiorColorFlag: v >= 64 } });
                            } else if (ev.param === 'colorMarker') {

                                canvas3d.setProps({ marking: { enabled: v >= 64 } });

                                canvas3d.setProps({ hiZ: { enabled: v >= 64 } });

                                canvas3d.setProps({ debug: { objectBoundingSpheres: v >= 64 } });

                        if (ev.type !== 'motion') return;

                        var camera = canvas3d.camera;
                        if (!camera) return;

                        // Apply rotation (rx, ry, rz) and translation (x, y, z)
                        var snapshot = camera.getSnapshot();
                        var rx = -ev.rx * ROTATE_SCALE;
                        var ry = -ev.ry * ROTATE_SCALE;
                        var rz = -ev.rz * ROTATE_SCALE;
                        var tx = -ev.x * TRANSLATE_SCALE;
                        var ty = -ev.y * TRANSLATE_SCALE;
                        var tz = -ev.z * TRANSLATE_SCALE;

                        // Use Mol*'s camera rotation via trackball-like approach
                        canvas3d.requestCameraReset({
                            snapshot: (function() {
                                var s = Object.assign({}, snapshot);
                                // Rotate around target
                                var up = [s.up[0], s.up[1], s.up[2]];
                                var pos = [s.position[0], s.position[1], s.position[2]];
                                var target = [s.target[0], s.target[1], s.target[2]];

                                // Direction from target to position
                                var dx = pos[0] - target[0];
                                var dy = pos[1] - target[1];
                                var dz = pos[2] - target[2];
                                var dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

                                // Forward vector
                                var fx = -dx/dist, fy = -dy/dist, fz = -dz/dist;
                                // Right vector = forward x up
                                var rightX = fy*up[2] - fz*up[1];
                                var rightY = fz*up[0] - fx*up[2];
                                var rightZ = fx*up[1] - fy*up[0];
                                var rLen = Math.sqrt(rightX*rightX + rightY*rightY + rightZ*rightZ);
                                rightX /= rLen; rightY /= rLen; rightZ /= rLen;

                                // Rotate around up axis (ry from spacemouse)
                                var cosA = Math.cos(ry), sinA = Math.sin(ry);
                                var ndx = dx*cosA + rightX*dist*sinA;
                                var ndy = dy*cosA + rightY*dist*sinA;
                                var ndz = dz*cosA + rightZ*dist*sinA;

                                // Rotate around right axis (rx from spacemouse)
                                var cosB = Math.cos(rx), sinB = Math.sin(rx);
                                var ux = up[0], uy = up[1], uz = up[2];
                                var dx2 = ndx*cosB - ux*dist*sinB;
                                var dy2 = ndy*cosB - uy*dist*sinB;
                                var dz2 = ndz*cosB - uz*dist*sinB;

                                var newDist = Math.sqrt(dx2*dx2 + dy2*dy2 + dz2*dz2);
                                dx2 = dx2/newDist * dist;
                                dy2 = dy2/newDist * dist;
                                dz2 = dz2/newDist * dist;

                                // Update up vector for rx rotation
                                var newFx = -dx2/dist, newFy = -dy2/dist, newFz = -dz2/dist;
                                var newUpX = ux*cosB + newFx*sinB;
                                var newUpY = uy*cosB + newFy*sinB;
                                var newUpZ = uz*cosB + newFz*sinB;

                                // Rotate around forward axis (rz - roll)
                                var cosC = Math.cos(rz), sinC = Math.sin(rz);
                                // Recompute right vector after previous rotations
                                var newRightX = newFy*newUpZ - newFz*newUpY;
                                var newRightY = newFz*newUpX - newFx*newUpZ;
                                var newRightZ = newFx*newUpY - newFy*newUpX;
                                var rLen2 = Math.sqrt(newRightX*newRightX + newRightY*newRightY + newRightZ*newRightZ);
                                newRightX /= rLen2; newRightY /= rLen2; newRightZ /= rLen2;
                                // Roll: rotate up vector around forward axis
                                var rolledUpX = newUpX*cosC + newRightX*sinC;
                                var rolledUpY = newUpY*cosC + newRightY*sinC;
                                var rolledUpZ = newUpZ*cosC + newRightZ*sinC;
                                newUpX = rolledUpX; newUpY = rolledUpY; newUpZ = rolledUpZ;

                                // Translate target (x=right, y=up, z=forward)
                                target[0] += rightX*tx + up[0]*ty + fx*tz;
                                target[1] += rightY*tx + up[1]*ty + fy*tz;
                                target[2] += rightZ*tx + up[2]*ty + fz*tz;

                                // Move camera with target (no zoom from tz)
                                s.position = [target[0] + dx2, target[1] + dy2, target[2] + dz2];
                                s.target = target;
                                s.up = [newUpX, newUpY, newUpZ];
                                return s;
                            })(),
                            durationMs: 0
                        });
                    } catch (e) {
                        // ignore parse errors
                    }
                });
            })();
