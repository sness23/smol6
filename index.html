<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
        <link rel="icon" href="/smol/favicon.ico" type="image/x-icon">
        <title>smol - Mol* with Console</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html, body {
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            hr {
                margin: 10px;
            }
            h1, h2, h3, h4, h5 {
                margin-top: 5px;
                margin-bottom: 3px;
            }
            button {
                padding: 2px;
            }
            #app {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
            }
            #console {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 400px;
                height: calc(8 * 1.5em + 40px);
                background-color: rgba(0, 0, 0, 0.7);
                color: #00ff00;
                font-family: 'Courier New', monospace;
                font-size: 12px;
                line-height: 1.5em;
                display: none;
                flex-direction: column;
                z-index: 10000;
            }
            #console.visible {
                display: flex;
            }
            #console.overlay {
                width: 100%;
                height: 100%;
                top: 0;
                left: 0;
                background-color: rgba(0, 0, 0, 0.3);
                font-size: 14px;
            }
            #console-output {
                flex: 1;
                overflow-y: auto;
                padding: 10px;
                white-space: pre-wrap;
                word-wrap: break-word;
            }
            #console-output::-webkit-scrollbar {
                width: 12px;
            }
            #console-output::-webkit-scrollbar-track {
                background: #1a1a1a;
            }
            #console-output::-webkit-scrollbar-thumb {
                background: #2a2a2a;
            }
            #console-output::-webkit-scrollbar-thumb:hover {
                background: #333333;
            }
            #console-input-line {
                display: flex;
                padding: 5px 10px;
                border-top: 1px solid rgba(0, 255, 0, 0.3);
            }
            #console-prompt {
                margin-right: 5px;
            }
            #console-input {
                flex: 1;
                background: transparent;
                border: none;
                color: #00ff00;
                font-family: 'Courier New', monospace;
                font-size: 12px;
                outline: none;
            }
            /* Knob HUD badge */
            #knob-hud {
                position: absolute;
                top: 12px;
                right: 12px;
                background-color: rgba(0, 0, 0, 0.75);
                color: #00ff00;
                font-family: 'Courier New', monospace;
                font-size: 13px;
                padding: 6px 12px;
                border-radius: 4px;
                border: 1px solid rgba(0, 255, 0, 0.25);
                z-index: 200000;
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.4s ease;
                white-space: nowrap;
            }
            #knob-hud.visible {
                opacity: 1;
                transition: opacity 0.05s ease;
            }
            #knob-hud-bar {
                display: inline-block;
                width: 80px;
                height: 8px;
                background-color: rgba(0, 255, 0, 0.15);
                border-radius: 2px;
                vertical-align: middle;
                margin: 0 8px;
                overflow: hidden;
            }
            #knob-hud-fill {
                height: 100%;
                background-color: #00ff00;
                border-radius: 2px;
                transition: width 0.05s ease;
            }
        </style>
        <link rel="stylesheet" type="text/css" href="/smol/molstar.css" />
    </head>
    <body>
        <div id="app"></div>
        <div id="knob-hud">
            <span id="knob-hud-name"></span>
            <span id="knob-hud-bar"><span id="knob-hud-fill"></span></span>
            <span id="knob-hud-value"></span>
        </div>
        <div id="console">
            <div id="console-output"></div>
            <div id="console-input-line">
                <span id="console-prompt">smol></span>
                <input type="text" id="console-input" autocomplete="off" />
            </div>
        </div>
        <script type="text/javascript" src="/smol/molstar.js"></script>
        <script type="text/javascript">
            function getParam(name, regex) {
                var r = new RegExp(name + '=' + '(' + regex + ')[&]?', 'i');
                return decodeURIComponent(((window.location.search || '').match(r) || [])[1] || '');
            }

            var debugMode = getParam('debug-mode', '[^&]+').trim() === '1';
            if (debugMode) molstar.setDebugMode(debugMode);

            var timingMode = getParam('timing-mode', '[^&]+').trim() === '1';
            if (timingMode) molstar.setTimingMode(timingMode);

            var hideControls = getParam('hide-controls', '[^&]+').trim() === '1';
            var collapseLeftPanel = getParam('collapse-left-panel', '[^&]+').trim() === '1';
            var pdbProvider = getParam('pdb-provider', '[^&]+').trim().toLowerCase();
            var emdbProvider = getParam('emdb-provider', '[^&]+').trim().toLowerCase();
            var mapProvider = getParam('map-provider', '[^&]+').trim().toLowerCase();
            var pixelScale = getParam('pixel-scale', '[^&]+').trim();
            var pickScale = getParam('pick-scale', '[^&]+').trim();
            var pickPadding = getParam('pick-padding', '[^&]+').trim();
            var transparency = getParam('transparency', '[^&]+').trim().toLowerCase();
            var preferWebgl1 = getParam('prefer-webgl1', '[^&]+').trim() === '1' || void 0;
            var allowMajorPerformanceCaveat = getParam('allow-major-performance-caveat', '[^&]+').trim() === '1';
            var powerPreference = getParam('power-preference', '[^&]+').trim().toLowerCase();
            var illumination = getParam('illumination', '[^&]+').trim() === '1';
            var resolutionMode = getParam('resolution-mode', '[^&]+').trim().toLowerCase();

            molstar.Viewer.create('app', {
                disabledExtensions: [],
                layoutShowControls: false,
                viewportShowExpand: false,
                collapseLeftPanel: collapseLeftPanel,
                pdbProvider: pdbProvider || 'pdbe',
                emdbProvider: emdbProvider || 'pdbe',
                volumeStreamingServer: (mapProvider || 'pdbe') === 'rcsb'
                    ? 'https://maps.rcsb.org'
                    : 'https://www.ebi.ac.uk/pdbe/densities',
                pixelScale: parseFloat(pixelScale) || 1,
                pickScale: parseFloat(pickScale) || 0.25,
                pickPadding: isNaN(parseFloat(pickPadding)) ? 1 : parseFloat(pickPadding),
                transparency: transparency || undefined,
                preferWebgl1: preferWebgl1,
                allowMajorPerformanceCaveat: allowMajorPerformanceCaveat,
                powerPreference: powerPreference || 'high-performance',
                illumination: illumination,
                resolutionMode: resolutionMode || 'auto'
            }).then(viewer => {
                window.viewer = viewer;
                viewer.plugin.canvas3d?.setProps({ renderer: { backgroundColor: 0x000000 } });

                var snapshotId = getParam('snapshot-id', '[^&]+').trim();
                if (snapshotId) viewer.setRemoteSnapshot(snapshotId);

                var snapshotUrl = getParam('snapshot-url', '[^&]+').trim();
                var snapshotUrlType = getParam('snapshot-url-type', '[^&]+').toLowerCase().trim() || 'molj';
                if (snapshotUrl && snapshotUrlType) viewer.loadSnapshotFromUrl(snapshotUrl, snapshotUrlType);

                var structureUrl = getParam('structure-url', '[^&]+').trim();
                var structureUrlFormat = getParam('structure-url-format', '[a-z]+').toLowerCase().trim();
                var structureUrlIsBinary = getParam('structure-url-is-binary', '[^&]+').trim() === '1';
                if (structureUrl) viewer.loadStructureFromUrl(structureUrl, structureUrlFormat, structureUrlIsBinary);

                var mvsUrl = getParam('mvs-url', '[^&]+').trim();
                var mvsData = getParam('mvs-data', '[^&]+').trim();
                var mvsFormat = getParam('mvs-format', '[^&]+').trim() || 'mvsj';
                if (mvsUrl && mvsData) console.error('Cannot specify mvs-url and mvs-data URL parameters at the same time. Ignoring both.');
                else if (mvsUrl) viewer.loadMvsFromUrl(mvsUrl, mvsFormat);
                else if (mvsData) viewer.loadMvsData(mvsData, mvsFormat);

                var pdb = getParam('pdb', '[^&]+').trim();
                if (pdb) viewer.loadPdb(pdb);

                var pdbIhm = getParam('pdb-ihm', '[^&]+').trim();
                if (pdbIhm) viewer.loadPdbIhm(pdbIhm);
                var pdbDev = getParam('pdb-dev', '[^&]+').trim();
                if (pdbDev) viewer.loadPdbIhm(pdbDev);

                var emdb = getParam('emdb', '[^&]+').trim();
                if (emdb) viewer.loadEmdb(emdb);

                var afdb = getParam('afdb', '[^&]+').trim();
                if (afdb) viewer.loadAlphaFoldDb(afdb);

                var modelArchive = getParam('model-archive', '[^&]+').trim();
                if (modelArchive) viewer.loadModelArchive(modelArchive);

                window.addEventListener('unload', () => {
                    viewer.dispose();
                });

                const event = new CustomEvent("molstarViewerCreated", { detail: { viewer } });
                window.dispatchEvent(event);

                // Listen for file to load from command line (via Electron IPC)
                if (window.ipcRenderer) {
                    window.ipcRenderer.on('load-file', function(event, filePath) {
                        loadFromUrl('file://' + filePath);
                    });

                    // Listen for remote commands (via HTTP server on port 8888)
                    window.ipcRenderer.on('execute-command', function(event, command) {
                        // Only auto-show console if consoleAutoShow is true
                        if (consoleAutoShow) {
                            showConsole();
                        }
                        // Display the command as if typed
                        addConsoleOutput('smol> ' + command);
                        addToHistory(command);
                        // Execute and send result back to main process
                        executeCommand(command, function(result) {
                            window.ipcRenderer.send('command-result', result);
                        });
                    });
                }
            });

            var consoleDiv = document.getElementById('console');
            var consoleOutput = document.getElementById('console-output');
            var consoleInput = document.getElementById('console-input');

            var commandHistory = [];
            var historyIndex = -1;
            var currentInput = '';
            var consoleAutoShow = true;  // When false, remote commands won't auto-show console
            var consoleMode = 'compact';  // 'compact' or 'overlay'

            function setConsoleMode(mode) {
                if (mode === 'overlay') {
                    consoleDiv.classList.add('overlay');
                    consoleMode = 'overlay';
                } else {
                    consoleDiv.classList.remove('overlay');
                    consoleMode = 'compact';
                }
            }

            function loadHistory() {
                try {
                    var saved = localStorage.getItem('molstar-console-history');
                    if (saved) {
                        commandHistory = JSON.parse(saved);
                        historyIndex = commandHistory.length;
                    }
                } catch (e) {
                    console.warn('Failed to load command history:', e);
                }
            }

            function saveHistory() {
                try {
                    var toSave = commandHistory.slice(-100);
                    localStorage.setItem('molstar-console-history', JSON.stringify(toSave));
                } catch (e) {
                    console.warn('Failed to save command history:', e);
                }
            }

            function addToHistory(command) {
                if (!command || command.trim() === '') return;
                if (commandHistory.length > 0 && commandHistory[commandHistory.length - 1] === command) {
                    return;
                }
                commandHistory.push(command);
                saveHistory();
                historyIndex = commandHistory.length;
            }

            function navigateHistory(direction) {
                if (commandHistory.length === 0) return;

                if (historyIndex === commandHistory.length) {
                    currentInput = consoleInput.value;
                }

                if (direction === 'up') {
                    if (historyIndex > 0) {
                        historyIndex--;
                        consoleInput.value = commandHistory[historyIndex];
                    }
                } else if (direction === 'down') {
                    if (historyIndex < commandHistory.length - 1) {
                        historyIndex++;
                        consoleInput.value = commandHistory[historyIndex];
                    } else {
                        historyIndex = commandHistory.length;
                        consoleInput.value = currentInput;
                    }
                }

                consoleInput.setSelectionRange(consoleInput.value.length, consoleInput.value.length);
            }

            function addConsoleOutput(text) {
                consoleOutput.textContent += text + '\n';
                consoleOutput.scrollTop = consoleOutput.scrollHeight;
            }

            function showConsole() {
                consoleDiv.classList.add('visible');
                consoleInput.focus();
            }

            function hideConsole() {
                consoleDiv.classList.remove('visible');
            }

            loadHistory();

            consoleOutput.addEventListener('wheel', function(e) {
                consoleOutput.scrollTop += e.deltaY;
                e.preventDefault();
                e.stopPropagation();
            }, { passive: false });

            showConsole();

            document.addEventListener('keydown', function(e) {
                if (e.key === 'F2') {
                    e.preventDefault();
                    if (consoleDiv.classList.contains('visible')) {
                        hideConsole();
                    } else {
                        consoleAutoShow = true;  // User explicitly showing console
                        showConsole();
                    }
                } else if (e.key === 'Enter' && !consoleDiv.classList.contains('visible')) {
                    e.preventDefault();
                    consoleAutoShow = true;  // User explicitly showing console
                    showConsole();
                }
            });

            consoleInput.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    e.preventDefault();
                    hideConsole();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    navigateHistory('up');
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    navigateHistory('down');
                } else if (e.key === 'Enter') {
                    var command = consoleInput.value.trim();
                    // During presentation, Enter (or q) controls the slideshow
                    if (_presentationActive) {
                        consoleInput.value = '';
                        handlePresentationInput(command);
                        return;
                    }
                    if (command) {
                        addConsoleOutput('smol> ' + command);
                        addToHistory(command);
                        executeCommand(command);
                        consoleInput.value = '';
                        historyIndex = commandHistory.length;
                        currentInput = '';
                    }
                }
            });

            // --- Presentation engine ---
            var _presentationActive = false;
            var _presentationSlides = [];
            var _presentationIndex = 0;
            var _presentationCb = null;

            function parseShowContent(content) {
                var slides = [];
                var sections = content.split(/^---$/m);
                var title = '';

                for (var i = 0; i < sections.length; i++) {
                    var section = sections[i].trim();
                    if (!section) continue;

                    var narration = [];
                    var commands = [];

                    var lines = section.split('\n');
                    for (var j = 0; j < lines.length; j++) {
                        var line = lines[j];
                        // Title line (# at top before first slide)
                        if (slides.length === 0 && narration.length === 0 && commands.length === 0 && line.match(/^#\s/)) {
                            title = line.replace(/^#\s+/, '');
                            continue;
                        }
                        // Skip ## comment lines
                        if (line.match(/^\s*##/)) continue;
                        // Command line
                        if (line.match(/^>\s*/)) {
                            commands.push(line.replace(/^>\s*/, ''));
                            continue;
                        }
                        // Narration
                        narration.push(line);
                    }

                    var narrationText = narration.join('\n').trim();
                    if (narrationText || commands.length > 0) {
                        slides.push({ narration: narrationText, commands: commands });
                    }
                }
                return { title: title, slides: slides };
            }

            function startPresentation(showPath, cb) {
                window.ipcRenderer.invoke('read-show-file', showPath).then(function(result) {
                    if (result.error) {
                        addConsoleOutput('Error: ' + result.error);
                        cb(result.error);
                        return;
                    }
                    var show = parseShowContent(result.content);
                    if (show.slides.length === 0) {
                        addConsoleOutput('Error: No slides found in ' + showPath);
                        cb('No slides');
                        return;
                    }

                    _presentationSlides = show.slides;
                    _presentationIndex = 0;
                    _presentationActive = true;
                    _presentationCb = cb;

                    addConsoleOutput('');
                    addConsoleOutput('━━━ PRESENT: ' + (show.title || showPath) + ' ━━━');
                    addConsoleOutput(show.slides.length + ' slides  •  Enter = next  •  q = quit');
                    addConsoleOutput('');

                    showPresentationSlide();
                });
            }

            function showPresentationSlide() {
                if (_presentationIndex >= _presentationSlides.length) {
                    endPresentation('Show complete.');
                    return;
                }

                var slide = _presentationSlides[_presentationIndex];
                var slideNum = _presentationIndex + 1;
                var total = _presentationSlides.length;

                addConsoleOutput('── slide ' + slideNum + '/' + total + ' ──');

                // Show narration
                if (slide.narration) {
                    addConsoleOutput('');
                    var lines = slide.narration.split('\n');
                    for (var i = 0; i < lines.length; i++) {
                        addConsoleOutput('  ' + lines[i]);
                    }
                    addConsoleOutput('');
                }

                // Execute commands sequentially with delay support
                executePresentationCommands(slide.commands, 0, function() {
                    if (_presentationIndex < _presentationSlides.length - 1) {
                        addConsoleOutput('  [Enter → next slide]');
                    } else {
                        addConsoleOutput('  [Enter → end]');
                    }
                    // Scroll console to bottom
                    var consoleOutput = document.getElementById('console-output');
                    if (consoleOutput) consoleOutput.scrollTop = consoleOutput.scrollHeight;
                });
            }

            function executePresentationCommands(commands, index, done) {
                if (!_presentationActive || index >= commands.length) {
                    done();
                    return;
                }

                var cmd = commands[index].trim();
                if (!cmd) {
                    executePresentationCommands(commands, index + 1, done);
                    return;
                }

                // Handle @delay directives
                var delayMatch = cmd.match(/^@([0-9]*\.?[0-9]*)$/);
                if (delayMatch) {
                    var delay = parseFloat(delayMatch[1]) || 0.5;
                    setTimeout(function() {
                        executePresentationCommands(commands, index + 1, done);
                    }, delay * 1000);
                    return;
                }

                // Execute as a regular command (but don't recurse into present)
                addConsoleOutput('  > ' + cmd);
                if (window.viewer && window.viewer.plugin && window.viewer.plugin.console) {
                    window.viewer.plugin.console.execute(cmd).then(function() {
                        executePresentationCommands(commands, index + 1, done);
                    }).catch(function() {
                        executePresentationCommands(commands, index + 1, done);
                    });
                } else {
                    // Fallback: send via HTTP to self (shouldn't normally happen)
                    executePresentationCommands(commands, index + 1, done);
                }
            }

            function endPresentation(msg) {
                _presentationActive = false;
                _presentationSlides = [];
                _presentationIndex = 0;
                addConsoleOutput('');
                addConsoleOutput('━━━ ' + msg + ' ━━━');
                addConsoleOutput('');
                if (_presentationCb) _presentationCb(msg);
                _presentationCb = null;
            }

            function handlePresentationInput(command) {
                if (!_presentationActive) return false;

                var cmd = command.trim().toLowerCase();
                if (cmd === 'q' || cmd === 'quit' || cmd === 'exit') {
                    endPresentation('Stopped.');
                    return true;
                }
                // Any input (including empty Enter) advances to next slide
                _presentationIndex++;
                showPresentationSlide();
                return true;
            }

            function formatFromPath(p) {
                var noQuery = p.split('?')[0].split('#')[0];
                var ext = noQuery.split('.').pop().toLowerCase();
                if (ext === 'pdb') return 'pdb';
                if (ext === 'sdf' || ext === 'mol') return 'sdf';
                if (ext === 'mol2') return 'mol2';
                if (ext === 'cif' || ext === 'mmcif') return 'mmcif';
                if (ext === 'xyz') return 'xyz';
                if (ext === 'gro') return 'gro';
                return 'mmcif';
            }

            function loadFromUrl(url, cb) {
                cb = cb || function() {};
                if (!window.viewer) {
                    var err = 'Error: Viewer not initialized';
                    addConsoleOutput(err); cb(err); return;
                }
                var format = formatFromPath(url);
                addConsoleOutput('Loading: ' + url);
                try {
                    var p = window.viewer.loadStructureFromUrl(url, format, false);
                    if (p && typeof p.then === 'function') {
                        p.then(function() {
                            var msg = 'Loaded: ' + url;
                            addConsoleOutput(msg); cb(msg);
                        }).catch(function(err) {
                            var msg = 'load failed: ' + (err && err.message ? err.message : String(err));
                            addConsoleOutput(msg); cb(msg);
                        });
                    } else {
                        cb('Loading: ' + url);
                    }
                } catch (e) {
                    var msg = 'load failed: ' + (e.message || String(e));
                    addConsoleOutput(msg); cb(msg);
                }
            }

            // Route through molstar's PyMOL-style 'load' command so errors
            // propagate, structures register in the session, and comma-separated
            // args like `, format=mmcif` are parsed correctly (`open` splits on
            // whitespace only and would glue a trailing comma onto the URL).
            function openViaMolstar(url, cb) {
                cb = cb || function() {};
                if (!window.viewer || !window.viewer.plugin || !window.viewer.plugin.console) {
                    var err = 'Error: Viewer not ready';
                    addConsoleOutput(err); cb(err); return;
                }
                window.viewer.plugin.console.execute('load ' + url).then(function(result) {
                    if (result && result.success) {
                        if (result.message) addConsoleOutput(result.message);
                        cb(result.message || 'OK');
                    } else {
                        var msg = 'Error: ' + (result && result.message ? result.message : 'load failed');
                        addConsoleOutput(msg); cb(msg);
                    }
                }).catch(function(err) {
                    var msg = 'Exception: ' + (err && err.message ? err.message : String(err));
                    addConsoleOutput(msg); cb(msg);
                });
            }

            function executeCommand(command, onResult) {
                var cb = onResult || function() {};

                // Handle "preset default" — global reset of all canvas3d parameters
                var cmdParts = command.trim().split(/\s+/);
                if (cmdParts[0].toLowerCase() === 'preset' && cmdParts.length > 1 && cmdParts[1].toLowerCase() === 'default') {
                    if (_defaultCanvas3dProps && window.viewer && window.viewer.plugin && window.viewer.plugin.canvas3d) {
                        var c3d = window.viewer.plugin.canvas3d;
                        var defaults = JSON.parse(JSON.stringify(_defaultCanvas3dProps));
                        c3d.setProps(defaults);
                        // Also reset camera view
                        window.viewer.plugin.managers.camera.reset();
                        var msg = 'Reset all parameters to defaults';
                        addConsoleOutput(msg);
                        cb(msg);
                    } else {
                        var msg = 'Error: Viewer not ready or defaults not captured';
                        addConsoleOutput(msg);
                        cb(msg);
                    }
                    return;
                }

                // Handle "present" command — run a .show slideshow
                if (cmdParts[0].toLowerCase() === 'present') {
                    if (cmdParts.length < 2) {
                        var msg = 'Usage: present <file.show>\n  present casp15/01-H1114-hydrogenase\n  present /absolute/path/to/file.show\n\nPress Enter to advance slides, q to quit.';
                        addConsoleOutput(msg);
                        cb(msg);
                    } else {
                        var showPath = cmdParts.slice(1).join(' ');
                        startPresentation(showPath, cb);
                    }
                    return;
                }

                // pwd — print session working directory
                if (cmdParts[0].toLowerCase() === 'pwd') {
                    if (window.ipcRenderer) {
                        window.ipcRenderer.invoke('fs-pwd').then(function(cwd) {
                            addConsoleOutput(cwd); cb(cwd);
                        });
                    } else {
                        cb('');
                    }
                    return;
                }

                // cd [<path>] — change session working directory (main-process state)
                if (cmdParts[0].toLowerCase() === 'cd') {
                    var cdArg = cmdParts.length > 1 ? cmdParts.slice(1).join(' ') : '';
                    if (window.ipcRenderer) {
                        window.ipcRenderer.invoke('fs-cd', cdArg).then(function(res) {
                            if (res && res.ok) {
                                addConsoleOutput(res.cwd); cb(res.cwd);
                            } else {
                                var msg = 'cd: ' + (res ? res.error : 'ipc error');
                                addConsoleOutput(msg); cb(msg);
                            }
                        });
                    } else {
                        cb('');
                    }
                    return;
                }

                // ls [<path>] — list entries in target (default: cwd)
                if (cmdParts[0].toLowerCase() === 'ls') {
                    var lsArg = cmdParts.length > 1 ? cmdParts.slice(1).join(' ') : '';
                    if (window.ipcRenderer) {
                        window.ipcRenderer.invoke('fs-ls', lsArg).then(function(res) {
                            if (!res || !res.ok) {
                                var msg = 'ls: ' + (res ? res.error : 'ipc error');
                                addConsoleOutput(msg); cb(msg); return;
                            }
                            var lines = res.entries.map(function(e) {
                                return e.isDir ? e.name + '/' : e.name;
                            });
                            if (res.truncated) {
                                lines.push('... and ' + (res.total - res.entries.length) + ' more');
                            }
                            var out = lines.join('\n') || '(empty)';
                            addConsoleOutput(out); cb(out);
                        });
                    } else {
                        cb('');
                    }
                    return;
                }

                // load — intercept for path/URL handling; pass through PDB IDs to molstar

                                var props = canvas3d.props;
                                var lights = props.renderer.light.slice();
                                if (lights.length < 2) lights.push({ inclination: 90, azimuth: 180, color: 16777215, intensity: 0.6 });
                                lights[1] = Object.assign({}, lights[1], { azimuth: (v / 127) * 360 });
                                canvas3d.setProps({ renderer: { light: lights } });
                            } else if (ev.param === 'light2Intensity') {
                                // Map 0-127 to light 2 intensity 0-5
                                var props = canvas3d.props;
                                var lights = props.renderer.light.slice();
                                if (lights.length < 2) lights.push({ inclination: 90, azimuth: 180, color: 16777215, intensity: 0.6 });
                                lights[1] = Object.assign({}, lights[1], { intensity: (v / 127) * 5 });
                                canvas3d.setProps({ renderer: { light: lights } });
                            } else if (ev.param === 'pickingAlpha') {
                                // Map 0-127 to picking alpha threshold 0-1
                                canvas3d.setProps({ renderer: { pickingAlphaThreshold: v / 127 } });
                            } else if (ev.param === 'metalness' || ev.param === 'roughness' || ev.param === 'bumpiness') {
                                // Map 0-127 to material property 0-1, applied to ALL representations
                                var matVal = v / 127;
                                var uniformName = ev.param === 'metalness' ? 'uMetalness' :
                                                  ev.param === 'roughness' ? 'uRoughness' : 'uBumpiness';
                                // Iterate all state cells to find representations with render objects
                                var plugin = viewer.plugin;
                                plugin.state.data.cells.forEach(function(cell) {
                                    if (cell && cell.obj && cell.obj.type && cell.obj.type.typeClass === 'Representation3D') {
                                        var repr = cell.obj.data.repr;
                                        if (repr && repr.renderObjects) {
                                            for (var ri = 0; ri < repr.renderObjects.length; ri++) {
                                                var ro = repr.renderObjects[ri];
                                                var uc = ro.values[uniformName];
                                                if (uc && uc.ref) {
                                                    uc.ref = { id: uc.ref.id, version: uc.ref.version + 1, value: matVal, metadata: uc.ref.metadata };
                                                }
                                            }
                                        }
                                    }
                                });
                                canvas3d.commit();
                                canvas3d.requestDraw();
                            } else if (ev.param === 'selectEdgeStrength') {
                                // Map 0-127 to select edge strength 0-1
                                canvas3d.setProps({ marking: { selectEdgeStrength: v / 127 } });
                            } else if (ev.param === 'transparentBg') {
                                // Boolean: 0-63 = off, 64-127 = on
                                canvas3d.setProps({ transparentBackground: v >= 64 });
                            } else if (ev.param === 'interiorColorFlag') {
                                // Boolean: 0-63 = off, 64-127 = on
                                canvas3d.setProps({ renderer: { interiorColorFlag: v >= 64 } });
                            } else if (ev.param === 'colorMarker') {
                                // Boolean: 0-63 = off, 64-127 = on
                                canvas3d.setProps({ renderer: { colorMarker: v >= 64 } });
                            } else if (ev.param === 'markingEnabled') {
                                // Boolean: 0-63 = off, 64-127 = on
                                canvas3d.setProps({ marking: { enabled: v >= 64 } });
                            } else if (ev.param === 'flyMode') {
                                // Boolean: 0-63 = off, 64-127 = on
                                canvas3d.setProps({ trackball: { flyMode: v >= 64 } });
                            } else if (ev.param === 'hizEnabled') {
                                // Boolean: 0-63 = off, 64-127 = on
                                canvas3d.setProps({ hiZ: { enabled: v >= 64 } });
                            } else if (ev.param === 'hizFrameLag') {
                                // Map 0-127 to HiZ frame lag 1-30
                                canvas3d.setProps({ hiZ: { maxFrameLag: Math.round(1 + (v / 127) * 29) } });
                            } else if (ev.param === 'debugSceneBounds') {
                                // Boolean: 0-63 = off, 64-127 = on
                                canvas3d.setProps({ debug: { sceneBoundingSpheres: v >= 64 } });
                            } else if (ev.param === 'debugObjBounds') {
                                // Boolean: 0-63 = off, 64-127 = on
                                canvas3d.setProps({ debug: { objectBoundingSpheres: v >= 64 } });
                            } else if (ev.param === 'userInteractionMs') {
                                // Map 0-127 to user interaction release 0-1000ms
                                canvas3d.setProps({ userInteractionReleaseMs: Math.round((v / 127) * 1000) });
                            } else if (ev.param === 'debugVisibleBounds') {
                                // Boolean: 0-63 = off, 64-127 = on
                                canvas3d.setProps({ debug: { visibleSceneBoundingSpheres: v >= 64 } });
                            }
                            // Show knob HUD feedback
                            var meta = _knobMeta[ev.param];
                            if (meta) {
                                var isBoolean = meta[5];
                                if (isBoolean) {
                                    showKnobHud(meta[0], v, v >= 64 ? 'ON' : 'OFF', '');
                                } else {
                                    var dispVal = meta[1] + (v / 127) * (meta[2] - meta[1]);
                                    showKnobHud(meta[0], v, dispVal.toFixed(meta[3]), meta[4]);
                                }
                            }
                            return;
                        }

                        if (ev.type !== 'motion') return;

                        var camera = canvas3d.camera;
                        if (!camera) return;

                        // Apply rotation (rx, ry, rz) and translation (x, y, z).
                        // Effective scale = base * live sensitivity (read each event).
                        var ROTATE_SCALE = ROTATE_SCALE_BASE * window.SPACEMOUSE_SENS.rotate;
                        var TRANSLATE_SCALE = TRANSLATE_SCALE_BASE * window.SPACEMOUSE_SENS.translate;
                        var snapshot = camera.getSnapshot();
                        var rx = -ev.rx * ROTATE_SCALE;
                        var ry = -ev.ry * ROTATE_SCALE;
                        var rz = -ev.rz * ROTATE_SCALE;
                        var tx = -ev.x * TRANSLATE_SCALE;
                        var ty = -ev.y * TRANSLATE_SCALE;
                        var tz = -ev.z * TRANSLATE_SCALE;

                        // Use Mol*'s camera rotation via trackball-like approach
                        canvas3d.requestCameraReset({
                            snapshot: (function() {
                                var s = Object.assign({}, snapshot);
                                // Rotate around target
                                var up = [s.up[0], s.up[1], s.up[2]];
                                var pos = [s.position[0], s.position[1], s.position[2]];
                                var target = [s.target[0], s.target[1], s.target[2]];

                                // Direction from target to position
                                var dx = pos[0] - target[0];
                                var dy = pos[1] - target[1];
                                var dz = pos[2] - target[2];
                                var dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

                                // Forward vector
                                var fx = -dx/dist, fy = -dy/dist, fz = -dz/dist;
                                // Right vector = forward x up
                                var rightX = fy*up[2] - fz*up[1];
                                var rightY = fz*up[0] - fx*up[2];
                                var rightZ = fx*up[1] - fy*up[0];
                                var rLen = Math.sqrt(rightX*rightX + rightY*rightY + rightZ*rightZ);
                                rightX /= rLen; rightY /= rLen; rightZ /= rLen;

                                // Rotate around up axis (ry from spacemouse)
                                var cosA = Math.cos(ry), sinA = Math.sin(ry);
                                var ndx = dx*cosA + rightX*dist*sinA;
                                var ndy = dy*cosA + rightY*dist*sinA;
                                var ndz = dz*cosA + rightZ*dist*sinA;

                                // Rotate around right axis (rx from spacemouse)
                                var cosB = Math.cos(rx), sinB = Math.sin(rx);
                                var ux = up[0], uy = up[1], uz = up[2];
                                var dx2 = ndx*cosB - ux*dist*sinB;
                                var dy2 = ndy*cosB - uy*dist*sinB;
                                var dz2 = ndz*cosB - uz*dist*sinB;

                                var newDist = Math.sqrt(dx2*dx2 + dy2*dy2 + dz2*dz2);
                                dx2 = dx2/newDist * dist;
                                dy2 = dy2/newDist * dist;
                                dz2 = dz2/newDist * dist;

                                // Update up vector for rx rotation
                                var newFx = -dx2/dist, newFy = -dy2/dist, newFz = -dz2/dist;
                                var newUpX = ux*cosB + newFx*sinB;
                                var newUpY = uy*cosB + newFy*sinB;
                                var newUpZ = uz*cosB + newFz*sinB;

                                // Rotate around forward axis (rz - roll)
                                var cosC = Math.cos(rz), sinC = Math.sin(rz);
                                // Recompute right vector after previous rotations
                                var newRightX = newFy*newUpZ - newFz*newUpY;
                                var newRightY = newFz*newUpX - newFx*newUpZ;
                                var newRightZ = newFx*newUpY - newFy*newUpX;
                                var rLen2 = Math.sqrt(newRightX*newRightX + newRightY*newRightY + newRightZ*newRightZ);
                                newRightX /= rLen2; newRightY /= rLen2; newRightZ /= rLen2;
                                // Roll: rotate up vector around forward axis
                                var rolledUpX = newUpX*cosC + newRightX*sinC;
                                var rolledUpY = newUpY*cosC + newRightY*sinC;
                                var rolledUpZ = newUpZ*cosC + newRightZ*sinC;
                                newUpX = rolledUpX; newUpY = rolledUpY; newUpZ = rolledUpZ;

                                // Translate target (x=right, y=up, z=forward)
                                target[0] += rightX*tx + up[0]*ty + fx*tz;
                                target[1] += rightY*tx + up[1]*ty + fy*tz;
                                target[2] += rightZ*tx + up[2]*ty + fz*tz;

                                // Move camera with target (no zoom from tz)
                                s.position = [target[0] + dx2, target[1] + dy2, target[2] + dz2];
                                s.target = target;
                                s.up = [newUpX, newUpY, newUpZ];
                                return s;
                            })(),
                            durationMs: 0
                        });
                    } catch (e) {
                        // ignore parse errors
                    }
                });
            })();
        </script>
    </body>
